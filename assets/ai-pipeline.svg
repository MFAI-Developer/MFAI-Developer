<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
<title id="title">From context to an AI application</title><desc id="desc">A five-stage AI pipeline: documents, embeddings, retrieval, language models and tools, then an API, web or voice application. Animated signals indicate the flow.</desc>
<style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
<rect x="1" y="1" width="1198" height="218" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace"><text x="29" y="35" fill="#b8cad9" font-size="18"><tspan fill="#54dfbc">$</tspan> build_ai_system --with-context --with-tools</text><text x="29" y="73" fill="#7991a8" font-size="14">01</text><rect x="26" y="84" width="211" height="82" rx="8" fill="#121e2b" stroke="#30475f"/><text x="131.5" y="117" text-anchor="middle" fill="#79b8ff" font-size="18" font-weight="600">DOCUMENTS</text><text x="131.5" y="145" text-anchor="middle" fill="#adbfce" font-size="14">PDF / text / data</text><path d="M240 125H257M252 120L257 125L252 130" fill="none" stroke="#54dfbc" stroke-width="2"/><text x="263" y="73" fill="#7991a8" font-size="14">02</text><rect x="260" y="84" width="211" height="82" rx="8" fill="#121e2b" stroke="#30475f"/><text x="365.5" y="117" text-anchor="middle" fill="#79b8ff" font-size="18" font-weight="600">EMBEDDINGS</text><text x="365.5" y="145" text-anchor="middle" fill="#adbfce" font-size="14">semantic vectors</text><path d="M474 125H491M486 120L491 125L486 130" fill="none" stroke="#54dfbc" stroke-width="2"/><text x="497" y="73" fill="#7991a8" font-size="14">03</text><rect x="494" y="84" width="211" height="82" rx="8" fill="#121e2b" stroke="#30475f"/><text x="599.5" y="117" text-anchor="middle" fill="#79b8ff" font-size="18" font-weight="600">RETRIEVAL</text><text x="599.5" y="145" text-anchor="middle" fill="#adbfce" font-size="14">relevant context</text><path d="M708 125H725M720 120L725 125L720 130" fill="none" stroke="#54dfbc" stroke-width="2"/><text x="731" y="73" fill="#7991a8" font-size="14">04</text><rect x="728" y="84" width="211" height="82" rx="8" fill="#121e2b" stroke="#8766bb"/><text x="833.5" y="117" text-anchor="middle" fill="#c4a1ff" font-size="18" font-weight="600">LLM + TOOLS</text><text x="833.5" y="145" text-anchor="middle" fill="#adbfce" font-size="14">reason + act</text><path d="M942 125H959M954 120L959 125L954 130" fill="none" stroke="#54dfbc" stroke-width="2"/><text x="965" y="73" fill="#7991a8" font-size="14">05</text><rect x="962" y="84" width="211" height="82" rx="8" fill="#121e2b" stroke="#30475f"/><text x="1067.5" y="117" text-anchor="middle" fill="#79b8ff" font-size="18" font-weight="600">APPLICATION</text><text x="1067.5" y="145" text-anchor="middle" fill="#adbfce" font-size="14">API / web / voice</text>
