<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="195" viewBox="0 0 1200 195" role="img" aria-labelledby="title desc"><title id="title">From documents to AI applications</title><desc id="desc">Documents flow through embeddings, retrieval, language models and tools to an application. Animated signals show the flow.</desc><style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style><rect x="1" y="1" width="1198" height="193" rx="12" fill="#0d1117" stroke="#30363d"/><g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace"><text x="30" y="34" fill="#a9bfd3" font-size="16">$ build_ai_system --with-context --with-tools</text><rect x="30" y="65" width="204" height="77" rx="9" fill="#111d2b" stroke="#2a425b"/><text x="132" y="96" text-anchor="middle" fill="#79c0ff" font-size="16" font-weight="600">DOCUMENTS</text><text x="132" y="121" text-anchor="middle" fill="#8b9eb2" font-size="13">PDF / text / data</text><path d="M237 104H261M255 99L261 104L255 109" fill="none" stroke="#3bd5b1" stroke-width="2"/><rect x="264" y="65" width="204" height="77" rx="9" fill="#111d2b" stroke="#2a425b"/><text x="366" y="96" text-anchor="middle" fill="#79c0ff" font-size="16" font-weight="600">EMBEDDINGS</text><text x="366" y="121" text-anchor="middle" fill="#8b9eb2" font-size="13">semantic vectors</text><path d="M471 104H495M489 99L495 104L489 109" fill="none" stroke="#3bd5b1" stroke-width="2"/><rect x="498" y="65" width="204" height="77" rx="9" fill="#111d2b" stroke="#2a425b"/><text x="600" y="96" text-anchor="middle" fill="#79c0ff" font-size="16" font-weight="600">RETRIEVAL</text><text x="600" y="121" text-anchor="middle" fill="#8b9eb2" font-size="13">relevant context</text><path d="M705 104H729M723 99L729 104L723 109" fill="none" stroke="#3bd5b1" stroke-width="2"/><rect x="732" y="65" width="204" height="77" rx="9" fill="#111d2b" stroke="#a371f7"/><text x="834" y="96" text-anchor="middle" fill="#d2a8ff" font-size="16" font-weight="600">LLM + TOOLS</text><text x="834" y="121" text-anchor="middle" fill="#8b9eb2" font-size="13">reason + act</text><path d="M939 104H963M957 99L963 104L957 109" fill="none" stroke="#3bd5b1" stroke-width="2"/><rect x="966" y="65" width="204" height="77" rx="9" fill="#111d2b" stroke="#2a425b"/><text x="1068" y="96" text-anchor="middle" fill="#79c0ff" font-size="16" font-weight="600">APPLICATION</text><text x="1068" y="121" text-anchor="middle" fill="#8b9eb2" font-size="13">API / web / voice</text><path d="M38 167H1162" stroke="#203349" stroke-width="2"/><circle class="motion" r="4" fill="#39d9ab"><animateMotion dur="7s" repeatCount="indefinite" path="M38 167H1162"/></circle><circle class="motion" r="3" fill="#79c0ff"><animateMotion dur="7s" begin="2.8s" repeatCount="indefinite" path="M38 167H1162"/></circle></g></svg>
