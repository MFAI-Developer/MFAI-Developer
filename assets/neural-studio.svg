<g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace"><text x="83" y="247" fill="#a0b0c7" font-size="17" >LLM APPS  /  RAG  /  AGENTS  /  VOICE</text><text x="81" y="293" fill="#637895" font-size="15" >01</text><text x="117" y="293" font-size="18" fill="#eef5ff" xml:space="preserve" opacity=".72"><tspan fill="#b99aff">def </tspan><tspan fill="#64e5ee">build_ai</tspan><tspan fill="#eef5ff">(query, retriever, model, tools):</tspan></text><clipPath id="line0"><rect x="116" y="271" width="0" height="29"><animate attributeName="width" values="0;560;560;0" keyTimes="0;.12;.92;1" dur="20s" begin="0s" repeatCount="indefinite"/></rect></clipPath><g class="motion" clip-path="url(#line0)"><text x="117" y="293" font-size="18" fill="#eef5ff" xml:space="preserve"><tspan fill="#b99aff">def </tspan><tspan fill="#64e5ee">build_ai</tspan><tspan fill="#eef5ff">(query, retriever, model, tools):</tspan></text></g><text x="81" y="323" fill="#637895" font-size="15" >02</text><text x="117" y="323" font-size="18" fill="#eef5ff" xml:space="preserve" opacity=".72">    <tspan fill="#64e5ee">context</tspan><tspan fill="#eef5ff"> = retriever.search(query)</tspan></text><clipPath id="line1"><rect x="116" y="301" width="0" height="29"><animate attributeName="width" values="0;560;560;0" keyTimes="0;.12;.92;1" dur="20s" begin="1.8s" repeatCount="indefinite"/></rect></clipPath><g class="motion" clip-path="url(#line1)"><text x="117" y="323" font-size="18" fill="#eef5ff" xml:space="preserve">    <tspan fill="#64e5ee">context</tspan><tspan fill="#eef5ff"> = retriever.search(query)</tspan></text></g><text x="81" y="353" fill="#637895" font-size="15" >03</text><text x="117" y="353" font-size="18" fill="#eef5ff" xml:space="preserve" opacity=".72">    <tspan fill="#64e5ee">result</tspan><tspan fill="#eef5ff"> = model.run(query, context, tools)</tspan></text><clipPath id="line2"><rect x="116" y="331" width="0" height="29"><animate attributeName="width" values="0;560;560;0" keyTimes="0;.12;.92;1" dur="20s" begin="3.6s" repeatCount="indefinite"/></rect></clipPath><g class="motion" clip-path="url(#line2)"><text x="117" y="353" font-size="18" fill="#eef5ff" xml:space="preserve">    <tspan fill="#64e5ee">result</tspan><tspan fill="#eef5ff"> = model.run(query, context, tools)</tspan></text></g><text x="81" y="383" fill="#637895" font-size="15" >04</text><text x="117" y="383" font-size="18" fill="#eef5ff" xml:space="preserve" opacity=".72">    <tspan fill="#b99aff">return </tspan><tspan fill="#eef5ff">{</tspan><tspan fill="#d1fc79">&quot;response&quot;</tspan><tspan fill="#eef5ff">: result}</tspan></text><clipPath id="line3"><rect x="116" y="361" width="0" height="29"><animate attributeName="width" values="0;560;560;0" keyTimes="0;.12;.92;1" dur="20s" begin="5.4s" repeatCount="indefinite"/></rect></clipPath><g class="motion" clip-path="url(#line3)"><text x="117" y="383" font-size="18" fill="#eef5ff" xml:space="preserve">    <tspan fill="#b99aff">return </tspan><tspan fill="#eef5ff">{</tspan><tspan fill="#d1fc79">&quot;response&quot;</tspan><tspan fill="#eef5ff">: result}</tspan></text></g>
