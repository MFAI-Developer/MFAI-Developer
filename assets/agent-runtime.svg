<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="370" viewBox="0 0 1280 370" role="img" aria-labelledby="title desc"><title id="title">Context, reasoning, and action — an AI engineering architecture</title><desc id="desc">An animated architecture diagram connects document retrieval to an LLM and agent core, then branches into APIs and tools, web and data, and voice and text. A feedback path shows tool results returning to the agent.</desc><style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
