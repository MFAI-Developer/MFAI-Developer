<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">Context to reasoning to action</title><desc id="desc">A stacked mobile architecture diagram: context retrieval, an LLM and agent, then APIs and tools, web and data, and voice and text.</desc><style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
<rect x="1" y="1" width="718" height="758" rx="14" fill="#0b0f15" stroke="#2b3544" stroke-width="2"/>
<g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace"><text x="34" y="48" fill="#d1fc79" font-size="23" >CONTEXT → REASONING → ACTION</text>
<rect x="110" y="89" width="500" height="135" rx="10" fill="#111720" stroke="#2b3544"/>
<text x="360" y="130" fill="#d1fc79" font-size="25" text-anchor="middle">CONTEXT</text><text x="360" y="168" fill="#edf2fa" font-size="23" text-anchor="middle">documents · text · data</text><text x="360" y="200" fill="#98a7ba" font-size="20" text-anchor="middle">embeddings + retrieval</text>
<path d="M360 224V299M360 496V551H132V595M360 551V595M360 551H588V595" fill="none" stroke="#455367" stroke-width="2"/>
<rect x="147" y="299" width="426" height="197" rx="12" fill="#171526" stroke="#bc9bff"/>
<text x="360" y="348" fill="#edf2fa" font-size="36" text-anchor="middle" font-weight="700">LLM + AGENT</text><text x="360" y="395" fill="#bc9bff" font-size="22" text-anchor="middle">model + orchestration</text><text x="360" y="449" fill="#98a7ba" font-size="22" text-anchor="middle">plan · retrieve · act</text>
<text x="360" y="739" fill="#65758a" font-size="18" text-anchor="middle">tools return context for the next step</text>
</g><rect x="26" y="595" width="212" height="110" rx="8" fill="#111720" stroke="#2b3544"/><g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace"><text x="132" y="637" fill="#edf2fa" font-size="20" text-anchor="middle">APIs + TOOLS</text><text x="132" y="674" fill="#98a7ba" font-size="16" text-anchor="middle">business actions</text></g><rect x="254" y="595" width="212" height="110" rx="8" fill="#111720" stroke="#2b3544"/><g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace"><text x="360" y="637" fill="#edf2fa" font-size="20" text-anchor="middle">WEB + DATA</text><text x="360" y="674" fill="#98a7ba" font-size="16" text-anchor="middle">interfaces</text></g><rect x="482" y="595" width="212" height="110" rx="8" fill="#111720" stroke="#2b3544"/><g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace"><text x="588" y="637" fill="#edf2fa" font-size="20" text-anchor="middle">VOICE + TEXT</text><text x="588" y="674" fill="#98a7ba" font-size="16" text-anchor="middle">conversation</text></g><g class="motion"><circle r="5" fill="#d1fc79"><animateMotion path="M360 224V299" dur="2.5s" repeatCount="indefinite"/></circle><circle r="5" fill="#bc9bff"><animateMotion path="M360 496V551H588V595" dur="3s" repeatCount="indefinite"/></circle></g></svg>